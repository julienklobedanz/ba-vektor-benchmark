# Angepasst an Compose-Servicenamen (mongodb / mongot).
# Grundlage: MongoDB Docs „Install MongoDB Search with Docker“.
syncSource:
  replicaSet:
    hostAndPort: "mongodb:27017"
    scramAuth:
      username: "mongotUser"
      passwordFile: "/passwordFile"
      authSource: "admin"
      tls:
        enabled: false
  replicationReader:
    readPreference: "primaryPreferred"

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    address: "mongot:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: true
  address: "0.0.0.0:9946"

healthCheck:
  address: "0.0.0.0:8080"

logging:
  verbosity: INFO
